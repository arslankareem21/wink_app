name: wink_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_fonts: ^8.1.0
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  google_nav_bar: ^5.0.7
  google_sign_in: ^6.2.2
  photo_manager: ^3.9.0
  permission_handler: ^12.0.1
  pro_video_editor: ^1.16.3
  video_player: ^2.11.1
  pro_image_editor: ^12.0.0
  image_picker: ^1.2.2
  media_kit: ^1.2.6
  path_provider: ^2.1.5
  cloudinary_flutter: ^1.3.0
  cloudinary_url_gen: ^1.8.0
  go_router: ^17.3.0
  http: ^1.6.0
  dio: ^5.9.2
  video_thumbnail: ^0.5.6
  visibility_detector: ^0.4.0+2
  firebase_storage: ^13.4.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

